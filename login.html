<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - GeniusAct</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(rgba(15, 23, 42, 0.55), rgba(15, 23, 42, 0.75)), url('assets/images/DJT-BACKGROUND.png') center/cover no-repeat fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .login-container {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      padding: 40px;
      border-radius: 14px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      margin-bottom: 20px;
      color: #25347A;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #25347A;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background: #1a2559;
    }
    .links {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }
    .links a {
      color: #25347A;
      text-decoration: none;
    }
  </style>

  <script id="img-fallback-handler">
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('img').forEach(function(img) {
        img.addEventListener('error', function() {
          this.onerror = null;
          this.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="120" viewBox="0 0 200 120"><rect width="100%" height="100%" fill="%2325347A"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%23ffffff" font-family="sans-serif" font-size="14" font-weight="bold">TRUMP 2024</text></svg>';
        });
      });
    });
  </script>

  <link rel="stylesheet" href="/static/css/mobile-premium.css">
</head>
<body>
  <div class="login-container">
    <h2>Login to Dashboard</h2>
    <form id="login_form">
      <input type="email" id="login_email" placeholder="Email Address" required />
      <input type="password" id="login_password" placeholder="Password" required />
      <button type="submit">Log In</button>
    </form>
    <div class="links">
      <p>Don't have an account? <br><br> <a href="contribute.html" style="font-weight: bold;">Contribute first to register</a></p>
    </div>
  </div>

  <script src="static/js/sync-engine.js"></script>
  <script src="static/js/auth.js"></script>
  <script src="static/js/footprint-tracker.js"></script>
  <script src="static/js/contact-us-widget.js"></script>
</body>
</html>
