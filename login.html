<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - GeniusAct</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(rgba(15, 23, 42, 0.55), rgba(15, 23, 42, 0.75)), url('assets/images/DJT-BACKGROUND.png') center/cover no-repeat fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .login-container {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      padding: 40px;
      border-radius: 14px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      margin-bottom: 20px;
      color: #25347A;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #25347A;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background: #1a2559;
    }
    .links {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }
    .links a {
      color: #25347A;
      text-decoration: none;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: #f1f5f9;
      color: #64748b;
      border: none;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #25347A;
      color: #ffffff;
    }
    .form-sec { display: none; }
    .form-sec.active { display: block; }
  </style>

  <script id="img-fallback-handler">
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('img').forEach(function(img) {
        img.addEventListener('error', function() {
          this.onerror = null;
          this.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="120" viewBox="0 0 200 120"><rect width="100%" height="100%" fill="%2325347A"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%23ffffff" font-family="sans-serif" font-size="14" font-weight="bold">TRUMP 2024</text></svg>';
        });
      });
    });
  </script>

  <link rel="stylesheet" href="/static/css/mobile-premium.css">
</head>
<body>
  <div class="login-container">
    <div style="display: flex; gap: 8px; margin-bottom: 20px; background: #e2e8f0; padding: 4px; border-radius: 8px;">
      <button class="tab-btn active" id="tab-login-btn" onclick="switchAuthTab('login')">Log In</button>
      <button class="tab-btn" id="tab-register-btn" onclick="switchAuthTab('register')">Register Account</button>
    </div>

    <!-- LOGIN FORM -->
    <div id="sec-login" class="form-sec active">
      <h2>Login to Dashboard</h2>
      <form id="login_form">
        <input type="email" id="login_email" placeholder="Email Address" required />
        <input type="password" id="login_password" placeholder="Password" required />
        <button type="submit">Log In</button>
      </form>
      <div class="links">
        <p>Or make a campaign contribution first:<br><a href="contribute.html" style="font-weight: bold; color: #25347A;">Contribute Tier & Settlement Proof &rarr;</a></p>
      </div>
    </div>

    <!-- REGISTER FORM -->
    <div id="sec-register" class="form-sec">
      <h2>Create Supporter Account</h2>
      <form id="direct_register_form">
        <input type="text" id="reg_fullname" placeholder="Full Name (Optional)" />
        <input type="email" id="reg_direct_email" placeholder="Email Address" required />
        <input type="password" id="reg_direct_password" placeholder="Create Password" required />
        <input type="number" id="reg_direct_amount" placeholder="Initial Contribution Amount ($)" value="1000" min="1" />
        <button type="submit" id="direct_reg_btn">Create Account & Submit</button>
      </form>
      <div id="reg-status-msg" style="margin-top: 12px; font-size: 0.85rem; text-align: center; font-weight: bold;"></div>
      <div class="links">
        <p>Already registered? <a href="#" onclick="switchAuthTab('login'); return false;" style="font-weight: bold; color: #25347A;">Log in here</a></p>
      </div>
    </div>
  </div>

  <script>
    function switchAuthTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.form-sec').forEach(s => s.classList.remove('active'));
      if (tab === 'login') {
        document.getElementById('tab-login-btn').classList.add('active');
        document.getElementById('sec-login').classList.add('active');
      } else {
        document.getElementById('tab-register-btn').classList.add('active');
        document.getElementById('sec-register').classList.add('active');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const regForm = document.getElementById('direct_register_form');
      if (regForm) {
        regForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const email = document.getElementById('reg_direct_email').value.trim().toLowerCase();
          const password = document.getElementById('reg_direct_password').value;
          const fullName = document.getElementById('reg_fullname').value.trim();
          const amount = parseFloat(document.getElementById('reg_direct_amount').value) || 1000;
          const btn = document.getElementById('direct_reg_btn');
          const msg = document.getElementById('reg-status-msg');

          if (!email || !password) {
            msg.style.color = '#dc2626';
            msg.textContent = 'Please enter email and password.';
            return;
          }

          btn.disabled = true;
          btn.textContent = 'Registering with Cloud Database...';
          msg.style.color = '#2563eb';
          msg.textContent = 'Syncing registration to Federal Campaign Registry...';

          try {
            const res = await fetch('/api/register', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                email,
                password,
                fullName,
                amount
              })
            });
            const data = await res.json();
            if (!res.ok && data.error && !data.error.includes('already pending')) {
              throw new Error(data.error);
            }

            // Sync locally as well
            const pending = JSON.parse(localStorage.getItem('geniusact_pending_users')) || [];
            if (!pending.some(u => u.email && u.email.toLowerCase() === email)) {
              pending.push(data.user || {
                uid: Date.now().toString(),
                email,
                password,
                fullName: fullName || email.split('@')[0],
                amount,
                date: new Date().toISOString(),
                status: 'pending',
                donations: [{ id: 'RCP-' + Math.floor(Math.random() * 10000000), amount, description: 'Initial Contribution', date: new Date().toISOString() }]
              });
              localStorage.setItem('geniusact_pending_users', JSON.stringify(pending));
            }

            if (window.cloudSyncFull) {
              try { await window.cloudSyncFull(); } catch(e) {}
            }

            msg.style.color = '#16a34a';
            msg.textContent = '🏛️ Supporter Account Created & Submitted for Admin Audit! Switching to Login...';

            setTimeout(() => {
              switchAuthTab('login');
              document.getElementById('login_email').value = email;
              document.getElementById('login_password').value = password;
              btn.disabled = false;
              btn.textContent = 'Create Account & Submit';
              msg.textContent = '';
            }, 2000);
          } catch(err) {
            msg.style.color = '#dc2626';
            msg.textContent = 'Registration Error: ' + err.message;
            btn.disabled = false;
            btn.textContent = 'Create Account & Submit';
          }
        });
      }
    });
  </script>

  <script src="static/js/sync-engine.js"></script>
  <script src="static/js/auth.js"></script>
  <script src="static/js/footprint-tracker.js"></script>
  <script src="static/js/contact-us-widget.js"></script>
</body>
</html>
